name: Generate Snake (fallback)

on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * *'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Install deps (none required for fallback)
        run: |
          python -m pip install --upgrade pip

      - name: Show repo files (debug)
        run: ls -la

      - name: Run fallback snake generator
        run: |
          python3 github-snake.py --username ${{ github.repository_owner }} --output output/github-contribution-grid-snake.svg

      - name: Commit & Push generated files
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add output/github-contribution-grid-snake.svg || true
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: update contribution snake (fallback)"
            git push
          fi

