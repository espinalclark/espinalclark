name: Generate Snake

on:
  schedule:
    - cron: '0 0 * * *'   # se ejecuta todos los días a medianoche UTC
  workflow_dispatch:       # permite ejecutarlo manualmente desde Actions
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate snake (SVG + GIF)
        id: snk
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }} # tu usuario automáticamente si es repo de perfil
          svg_out_path: output/github-contribution-grid-snake.svg
          gif_out_path: output/github-snake.gif

      - name: Commit and push generated files
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add output/github-contribution-grid-snake.svg output/github-snake.gif || true
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: update contribution snake"
            git push
